name: Release Signed APK

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag (e.g. v1.0.0)'
        required: true
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Decode Keystore from GitHub Secrets
        if: ${{ secrets.KEYSTORE_BASE64 != '' }}
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" \vert{} base64 -d > "${{ github.workspace }}/release-key.jks"

      - name: Build Signed Release APK
        env:
          KEYSTORE_FILE: ${{ github.workspace }}/release-key.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          RAW_TAG="${{ github.event.inputs.tag_name || github.ref_name }}"
          CLEAN_VER="${RAW_TAG#v}"
          ./gradlew test assembleRelease -PversionName="$CLEAN_VER" --stacktrace

      - name: Prepare APK and SHA-256 Checksum
        id: prep
        run: |
          RAW_TAG="${{ github.event.inputs.tag_name || github.ref_name }}"
          CLEAN_VER="${RAW_TAG#v}"
          APK_OUT="HyperPlay-v${CLEAN_VER}.apk"
          FOUND_APK=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          cp "$FOUND_APK" "$APK_OUT"
          sha256sum "$APK_OUT" > "${APK_OUT}.sha256"
          echo "apk_file=$APK_OUT" >> "$GITHUB_OUTPUT"
          echo "sha_file=${APK_OUT}.sha256" >> "$GITHUB_OUTPUT"
          echo "tag_name=$RAW_TAG" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.prep.outputs.tag_name }}
          name: "HyperPlay ${{ steps.prep.outputs.tag_name }}"
          body_path: CHANGELOG.md
          files: |
            ${{ steps.prep.outputs.apk_file }}${{ steps.prep.outputs.sha_file }}
