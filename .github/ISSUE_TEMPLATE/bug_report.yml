name: Bug Report / Device Compatibility
description: Report a bug or share a device compatibility report from the System tab
title: "[Bug]: "
labels: ["bug"]
body:
  - type: input
    id: version
    attributes:
      label: App Version
      placeholder: "1.0.0"
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the issue and steps to reproduce it.
    validations:
      required: true
  - type: textarea
    id: system_report
    attributes:
      label: Diagnostic Report (System Tab -> Copy Diagnostic Report)
      description: Paste the report copied from the System tab in HyperPlay.
      render: shell
    validations:
      required: true
